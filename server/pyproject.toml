[project]
name = "enzo-agent"
version = "0.1.0"
description = "Enzo: a private, local-first personal AI agent that runs on your own model accounts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Atishay Jain" }]
requires-python = ">=3.13"
keywords = ["agent", "assistant", "llm", "chatgpt", "claude", "local-first", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.9.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.163.1",
    "jsonschema>=4.26.0",
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "openai>=3.52.0",
    "pgvector>=0.5.1",
    "pixeltable-pgserver>=0.7.2",
    "psutil>=7.2.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/Atishay8192261/Enzo"
Source = "https://github.com/Atishay8192261/Enzo"
Issues = "https://github.com/Atishay8192261/Enzo/issues"

[project.scripts]
enzo = "enzo.cli:main"
enzo-server = "enzo.__main__:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is enzo-agent (the name enzo is taken on PyPI); the code is still `import enzo`.
module-name = "enzo"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.5",
    "types-jsonschema>=4.26.0.20261006",
    "types-psutil>=7.2.2.20261111",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "N", "ANN", "C4", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
# Adapters take keyword-only configuration; positional arity is what hurts readability.
max-args = 7

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]  # asserts, fake test credentials

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A hung test fails loudly instead of stalling CI.
timeout = 30
filterwarnings = ["error"]
addopts = "-ra --strict-markers"
