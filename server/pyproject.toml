[project]
name = "enzo"
version = "0.1.0"
description = "Personal AI agent with a swappable LLM brain"
authors = [{ name = "Atishay Jain" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
enzo-server = "enzo.__main__:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "N", "ANN", "C4", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = "-ra --strict-markers"
