# ---------- Routing (ADR 0010) ----------
# A task maps to a tier. The router then picks that tier's brain from the providers the user
# connected, spreading conversations across them; a conversation stays with one provider, and
# falls back once to the next connected provider's brain of the same tier.

[routing]
default = "balanced"    # everyday replies: Claude Sonnet 5.5 / GPT-6.2 Sol (decision 2026-11-17)

[routing.tasks]
light = "fast"          # triage, short summaries: cheap and fast
streaming = "balanced"  # live replies: low time-to-first-token
hard = "powerful"       # planning, tool orchestration, long documents: strongest

[routing.classify]
long_message_chars = 20000  # a longer new message (a pasted document) is a hard task

# ---------- Context budget (spec §1.3.5, §5.2; ADR 0024) ----------
# How each brain's context window is split. Checked before every brain call, mid-turn too.
#   hard limit  = window x (1 - margin) - reply tokens        a prompt above it is never sent
#   compact at  = min(compact_at, long-context price step, hard limit x (1 - task_share))
# At the start of a turn a prompt above "compact at" first has its older turns summarized
# (the newest keep_recent tokens of turns stay word for word); mid-turn only the hard limit does.
# Grok and Kimi have no confirmed window yet, so they get the small default_window.

[context]
margin = 0.10              # never filled: estimate error and provider overhead
reply_tokens = 16000       # reserved for each reply (every call's max_output_tokens)
task_share = 0.25          # kept free at a turn's start for the new task and its tool results
compact_at = 150000        # Anthropic's server-side compaction default trigger (platform.claude.com, read 2026-11-25): cost, speed, focus
keep_recent = 30000        # newest turns kept word for word after a summary
summary_tokens = 16000     # the summarizer's max_output_tokens
summary_tier = "fast"      # the conversation's own provider's fast brain writes summaries
exact_above = 0.8          # local estimate first; above 80% of a limit, ask the provider (exact)
default_window = 128000    # for a brain whose window is not confirmed
tool_inline_chars = 20000  # a longer tool result is stored as a file: the context keeps its start
paste_inline_chars = 100000  # a longer pasted message is stored the same way
excerpt_chars = 4000       # how much of a stored text stays in the context
recall_tokens = 1500       # most that recalled memories + past-chat excerpts add to a message (ADR 0030)

# Local estimate: characters per token, kept below each provider's published average so it
# over-counts. Anthropic: "1M tokens is roughly 2.5M Unicode characters on the current
# tokenizer" (platform.claude.com models overview, read 2026-11-25). OpenAI: the common
# characters / 4 rule (developers.openai.com token-counting guide, read 2026-11-25).
# Anything else: 2.0 until measured. Non-ASCII characters always count as one token each.
[context.chars_per_token]
anthropic = 2.0
openai = 3.0
default = 2.0
