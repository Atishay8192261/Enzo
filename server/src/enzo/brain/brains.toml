# Brains Enzo can use, and how tasks route to them (spec §1.3.3).
#
# - Keys never live here. Each brain names the environment variable holding its key.
# - Prices are USD per 1M tokens, copied from the provider's published pricing on the date in
#   `source`. A price that could not be confirmed is left out on purpose: the call then records
#   its cost as unknown, never as 0 (spec §1.3.5).
# - A brain is only "supported" once it passes live conformance (spec §1.4, §16).
# - tier: fast | balanced | powerful. recommended: Enzo's pick for that provider and tier.

# ---------- Anthropic (Claude) ----------

[brains.claude-opus]
api = "anthropic"
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"
effort = "medium"  # the model's default, set explicitly
tier = "powerful"
recommended = true

[brains.claude-opus.pricing]
source = "Claude API pricing table (cached 2026-11-03), cache writes 1.25x (5m) / 2x (1h) of input; read 2026-11-17"
rates = { input = 4.00, output = 20.00, cached_input = 0.20, cache_write = { "5m" = 5.00, "1h" = 8.00 } }

[brains.claude-sonnet]
api = "anthropic"
model = "claude-sonnet-5-5"
api_key_env = "ANTHROPIC_API_KEY"
tier = "balanced"
recommended = true
note = "Default for everyday replies"

[brains.claude-sonnet.pricing]
source = "Claude API pricing table (cached 2026-11-03), cache writes 1.25x (5m) / 2x (1h) of input; read 2026-11-17"
rates = { input = 2.00, output = 10.00, cached_input = 0.10, cache_write = { "5m" = 2.50, "1h" = 4.00 } }

[brains.claude-haiku]
api = "anthropic"
model = "claude-haiku-5-5"
api_key_env = "ANTHROPIC_API_KEY"
tier = "fast"
recommended = true

[brains.claude-haiku.pricing]
# Cache-read price is only given as "~0.1x" for this model, so it is left out (unknown).
source = "Claude API pricing table (cached 2026-11-03): $0.10/$0.50 up to 100K-token prompts, $0.50/$2.50 beyond; read 2026-11-17"
rates = { input = 0.10, output = 0.50, cache_write = { "5m" = 0.125, "1h" = 0.20 } }
long_context = { from_input_tokens = 100001, rates = { input = 0.50, output = 2.50, cache_write = { "5m" = 0.625, "1h" = 1.00 } } }

