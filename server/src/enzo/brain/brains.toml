# Brains Enzo can use, and how tasks route to them (spec §1.3.3).
#
# - Keys never live here. Each brain names the environment variable holding its key.
# - Prices are USD per 1M tokens, copied from the provider's published pricing on the date in
#   `source`. A price that could not be confirmed is left out on purpose: the call then records
#   its cost as unknown, never as 0 (spec §1.3.5).
# - A brain is only "supported" once it passes live conformance (spec §1.4, §16).
# - tier: fast | balanced | powerful. recommended: Enzo's pick for that provider and tier.
# - context_window / max_output_tokens: tokens, from the provider's model page on the date in
#   `limits_source`. Left out when unconfirmed: the brain is then budgeted as the small
#   `context.default_window` (see [context] at the end).
# - vision: the [vision.<profile>] that says how the brain sees images (see the end). A brain
#   without one cannot see images, and a message with an image is never routed to it.

# ---------- Anthropic (Claude) ----------

[brains.claude-opus]
api = "anthropic"
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"
vision = "claude"
effort = "medium"  # the model's default, set explicitly
tier = "powerful"
recommended = true
context_window = 1000000
max_output_tokens = 128000
limits_source = "https://platform.claude.com/docs/en/about-claude/models/overview (context window 1M, max output 128K), read 2026-11-25"

[brains.claude-opus.pricing]
source = "Claude API pricing table (cached 2026-11-03), cache writes 1.25x (5m) / 2x (1h) of input; read 2026-11-17"
rates = { input = 4.00, output = 20.00, cached_input = 0.20, cache_write = { "5m" = 5.00, "1h" = 8.00 } }

