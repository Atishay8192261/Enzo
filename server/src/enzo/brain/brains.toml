# Brains Enzo can use, and how tasks route to them (spec §1.3.3).
#
# - Keys never live here. Each brain names the environment variable holding its key.
# - Prices are USD per 1M tokens, copied from the provider's published pricing on the date in
#   `source`. A price that could not be confirmed is left out on purpose: the call then records
#   its cost as unknown, never as 0 (spec §1.3.5).
# - A brain is only "supported" once it passes live conformance (spec §1.4, §16).

# ---------- Anthropic (Claude) ----------

[brains.claude-opus]
api = "anthropic"
model = "claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"
effort = "medium"  # the model's default, set explicitly

[brains.claude-opus.pricing]
source = "Claude API pricing table (cached 2026-11-03), cache writes 1.25x (5m) / 2x (1h) of input; read 2026-11-17"
rates = { input = 4.00, output = 20.00, cached_input = 0.20, cache_write = { "5m" = 5.00, "1h" = 8.00 } }

[brains.claude-sonnet]
api = "anthropic"
model = "claude-sonnet-5-5"
api_key_env = "ANTHROPIC_API_KEY"

[brains.claude-sonnet.pricing]
source = "Claude API pricing table (cached 2026-11-03), cache writes 1.25x (5m) / 2x (1h) of input; read 2026-11-17"
rates = { input = 2.00, output = 10.00, cached_input = 0.10, cache_write = { "5m" = 2.50, "1h" = 4.00 } }

[brains.claude-haiku]
api = "anthropic"
model = "claude-haiku-5-5"
api_key_env = "ANTHROPIC_API_KEY"

[brains.claude-haiku.pricing]
# Cache-read price is only given as "~0.1x" for this model, so it is left out (unknown).
source = "Claude API pricing table (cached 2026-11-03): $0.10/$0.50 up to 100K-token prompts, $0.50/$2.50 beyond; read 2026-11-17"
rates = { input = 0.10, output = 0.50, cache_write = { "5m" = 0.125, "1h" = 0.20 } }
long_context = { from_input_tokens = 100001, rates = { input = 0.50, output = 2.50, cache_write = { "5m" = 0.625, "1h" = 1.00 } } }

# ---------- OpenAI (GPT), Responses API ----------

[brains.gpt-astra]
api = "openai-responses"
model = "gpt-6.2-astra"
api_key_env = "OPENAI_API_KEY"

[brains.gpt-astra.pricing]
source = "https://developers.openai.com/api/docs/pricing (standard; short context <=272K input), read 2026-11-17"
rates = { input = 8.00, output = 40.00, cached_input = 0.40, cache_write = { "30m" = 10.00, "12h" = 20.00 } }
long_context = { from_input_tokens = 272001, rates = { input = 16.00, output = 60.00, cached_input = 0.80, cache_write = { "30m" = 20.00, "12h" = 40.00 } } }

[brains.gpt-sol]
api = "openai-responses"
model = "gpt-6.2-sol"
api_key_env = "OPENAI_API_KEY"

[brains.gpt-sol.pricing]
source = "https://developers.openai.com/api/docs/pricing (standard; short context <=272K input), read 2026-11-17"
rates = { input = 2.00, output = 10.00, cached_input = 0.10, cache_write = { "30m" = 2.50, "12h" = 5.00 } }
long_context = { from_input_tokens = 272001, rates = { input = 4.00, output = 15.00, cached_input = 0.20, cache_write = { "30m" = 5.00, "12h" = 10.00 } } }

[brains.gpt-luna]
api = "openai-responses"
model = "gpt-6-luna"
api_key_env = "OPENAI_API_KEY"

[brains.gpt-luna.pricing]
source = "https://developers.openai.com/api/docs/pricing (standard; short context <=272K input), read 2026-11-17"
rates = { input = 0.10, output = 0.50, cached_input = 0.01, cache_write = { "30m" = 0.125, "12h" = 0.25 } }
long_context = { from_input_tokens = 272001, rates = { input = 0.20, output = 0.75, cached_input = 0.02, cache_write = { "30m" = 0.25, "12h" = 0.50 } } }

# ---------- xAI (Grok), OpenAI-compatible Responses API ----------

[brains.grok]
api = "openai-responses"
provider = "xai"
base_url = "https://api.x.ai/v1"
model = "grok-4.7"
api_key_env = "XAI_API_KEY"

[brains.grok.pricing]
# Cached price beyond 200K-token prompts was not found: unknown there.
source = "https://docs.x.ai/developers/pricing via search, read 2026-11-17"
rates = { input = 2.00, output = 6.00, cached_input = 0.50 }
long_context = { from_input_tokens = 200000, rates = { input = 4.00, output = 12.00 } }

# ---------- Moonshot (Kimi), OpenAI-compatible Responses API ----------

[brains.kimi]
api = "openai-responses"
provider = "moonshot"
base_url = "https://api.moonshot.ai/v1"
model = "kimi-k3.1-pro"
api_key_env = "MOONSHOT_API_KEY"

[brains.kimi.pricing]
# Official pages disagree on cache-write prices, so cache writes are unknown.
source = "https://platform.kimi.ai/docs/guide/kimi-k3-1-pro-quickstart via search (dated 2026-10-24), read 2026-11-17"
rates = { input = 2.00, output = 10.00, cached_input = 0.20 }

[brains.kimi-k3]
api = "openai-responses"
provider = "moonshot"
base_url = "https://api.moonshot.ai/v1"
model = "kimi-k3"
api_key_env = "MOONSHOT_API_KEY"

[brains.kimi-k3.pricing]
source = "https://www.kimi.ai/blog/kimi-k3 via search, read 2026-11-17"
rates = { input = 3.00, output = 15.00, cached_input = 0.30 }

# ---------- Routing ----------

[routing]
default = "claude-opus"

[routing.tasks]
light = "claude-haiku"       # triage, short summaries: cheap and fast
hard = "claude-opus"         # planning, tool orchestration, long documents: strongest
streaming = "claude-sonnet"  # live replies: low time-to-first-token

[routing.fallback]           # tried once, only on rate limit / server / connection / timeout
claude-opus = "gpt-astra"
claude-sonnet = "gpt-sol"
claude-haiku = "gpt-luna"
gpt-astra = "claude-opus"
gpt-sol = "claude-sonnet"
gpt-luna = "claude-haiku"
grok = "gpt-sol"
kimi = "gpt-sol"
kimi-k3 = "gpt-sol"
