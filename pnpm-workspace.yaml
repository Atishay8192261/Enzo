packages:
  - "clients/*"

# Only these packages may run install scripts (supply-chain hardening).
onlyBuiltDependencies:
  - esbuild

# Install every platform's native packages (OpenTUI's libopentui), so a release build can
# cross-compile the terminal app for macOS and Linux from one machine.
supportedArchitectures:
  os: [current, darwin, linux]
  cpu: [current, x64, arm64]
  libc: [current, glibc]
